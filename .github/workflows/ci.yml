name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    # monocypher is vendored → zero external deps, so this is just
    # configure + build + ctest on both Linux and macOS (proves portability).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build -j

      - name: test
        run: ctest --test-dir build --output-on-failure
